<html lang="th">
<head>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #006064;
            margin: 0 0 10px 0;
        }
        .controls {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        button {
            background-color: #00acc1;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #00838f; }
        
        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            display: none; /* ซ่อนไว้ก่อนกดเริ่ม */
            position: relative;
        }
        .progress-bar {
            height: 8px;
            background-color: #eee;
            width: 100%;
        }
        .progress-fill {
            height: 100%;
            background-color: #ff5252;
            width: 100%;
            transition: width 1s linear;
        }
        .timer-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff5252;
            color: white;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #f5f5f5;
        }
        .card-body {
            padding: 20px;
        }
        .anagram {
            font-size: 2.5rem;
            font-weight: 900;
            color: #333;
            letter-spacing: 5px;
            margin: 15px 0;
            text-transform: uppercase;
        }
        
        .answer-section {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .correct-word {
            font-size: 2rem;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .meaning {
            font-size: 1.2rem;
            color: #555;
        }
        .meta-info {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }
        
        .btn-next {
            background-color: #43a047;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .btn-next:hover { background-color: #2e7d32; }
        
        .counter {
            margin-top: 15px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>

        let currentList = [];
        let currentIndex = 0;
        let timerInterval;
        let timeLeft = 12;

        // ฟังก์ชันสลับตำแหน่งอักษรแบบคงช่องว่างไว้ (ฉลาดขึ้น)
        function generateAnagram(word) {
            // เอาเฉพาะตัวอักษรมาสลับ
            let letters = word.replace(/\s+/g, '').split('');
            for (let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            
            // นำตัวอักษรที่สลับแล้ว ไปใส่กลับที่เดิม โดยคงตำแหน่งช่องว่างไว้
            let result = '';
            let letterIdx = 0;
            for (let i = 0; i < word.length; i++) {
                if (word[i] === ' ') {
                    result += ' &nbsp;&nbsp; '; // เพิ่มช่องว่างให้เห็นชัดๆ
                } else {
                    result += letters[letterIdx++];
                }
            }
            
            // เช็คว่าบังเอิญสลับแล้วได้คำเดิมหรือเปล่า (ถ้าใช่ให้สลับใหม่)
            if (result.replace(/&nbsp;/g, '').replace(/\s+/g, '') === word.replace(/\s+/g, '') && word.length > 1) {
                return generateAnagram(word);
            }
            return result.toUpperCase();
        }

        // ฟังก์ชันเริ่มเกม
        function startGame() {
            const selectedWeek = document.getElementById('weekSelect').value;
            
            if (selectedWeek === 'ALL') {
                currentList = [...allWords];
            } else {
                currentList = allWords.filter(item => item.week === selectedWeek);
            }

            // สุ่มลำดับคำถาม (Shuffle) ให้ไม่จำเจ
            for (let i = currentList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
            }

            currentIndex = 0;
            document.getElementById('flashcard').style.display = 'block';
            showCard();
        }

        function showCard() {
            const currentItem = currentList[currentIndex];
            
            // อัปเดตข้อมูลบนหน้าจอ
            document.getElementById('questionCounter').innerText = `ข้อที่ ${currentIndex + 1} / ${currentList.length} (${currentItem.week})`;
            document.getElementById('subjectText').innerText = `หมวดหมู่: ${currentItem.subject}`;
            document.getElementById('cardImg').src = currentItem.img;
            document.getElementById('anagramText').innerHTML = generateAnagram(currentItem.word);
            
            // ซ่อนเฉลย และซ่อนปุ่มถัดไป
            document.getElementById('answerSection').style.display = 'none';
            document.getElementById('btnNext').style.display = 'none';
            
            // ตั้งค่าเวลาใหม่เป็น 12 วินาที
            timeLeft = 12;
            document.getElementById('timerText').innerText = timeLeft;
            document.getElementById('progressFill').style.width = '100%';
            
            clearInterval(timerInterval);
            
            // เริ่มนับถอยหลัง
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerText').innerText = timeLeft;
                document.getElementById('progressFill').style.width = ((timeLeft / 12) * 100) + '%';
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    revealAnswer();
                }
            }, 1000);
        }

        function revealAnswer() {
            const currentItem = currentList[currentIndex];
            
            // แสดงคำตอบ
            document.getElementById('correctWord').innerText = currentItem.word.toUpperCase();
            document.getElementById('meaningText').innerText = currentItem.meaning;
            document.getElementById('metaInfo').innerText = `ชนิดคำ: ${currentItem.pos}`;
            
            document.getElementById('answerSection').style.display = 'block';
            
            // แสดงปุ่มเพื่อไปข้อถัดไป
            document.getElementById('btnNext').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentList.length) {
                showCard();
            } else {
                alert('🎉 เยี่ยมมาก! ฝึกซ้อมชุดนี้จบแล้วครับ');
                document.getElementById('flashcard').style.display = 'none';
                document.getElementById('questionCounter').innerText = '';
            }
        }
